<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes commandes</title>
<style>
  body { margin:0; font-family:Arial,sans-serif; color:#222; }
  header { background:#c8102e; color:#fff; padding:16px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  a.retour { color:#fff; text-decoration:none; display:block; text-align:left; margin-bottom:8px; }
  .cmd { border:2px solid #c8102e; border-radius:10px; margin:12px; padding:12px; }
  .cmd b { color:#c8102e; }
  .statut { display:inline-block; background:#c8102e; color:#fff; border-radius:6px; padding:2px 8px; font-size:14px; }
  small { color:#666; }
</style>
<link rel="stylesheet" href="style-tme.css">
</head>
<body>
<header><a class="retour" href="index.html">&larr; Accueil</a><h1>Mes commandes</h1></header>
<div id="liste"></div>
<script>
const el = document.getElementById("liste");
function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
let session = null;
try { session = JSON.parse(localStorage.getItem("session")); } catch (e) {}
if (!session || !session.token) {
  el.innerHTML = '<p style="padding:16px">Connectez-vous pour voir vos commandes. <a href="connexion.html">Se connecter</a></p>';
} else {
  fetch("https://szyegriofpvgjrukfbto.supabase.co/rest/v1/commandes?select=*&user_id=eq." + encodeURIComponent(session.user_id) + "&order=id.desc", {
    headers: { apikey: "sb_publishable_bc1uBcwArMaeTkzJP5USuw_JT7Mg1xe", Authorization: "Bearer " + session.token }
  })
  .then(r => {
    if (r.status === 401) { localStorage.removeItem("session"); location.href = "connexion.html"; return null; }
    if (!r.ok) throw new Error(r.status);
    return r.json();
  })
  .then(cmds => {
    if (!cmds) return;
    if (cmds.length === 0) { el.innerHTML = '<p style="padding:16px">Aucune commande pour le moment.</p>'; return; }
    el.innerHTML = cmds.map(c => {
      let lignes = c.lignes;
      if (typeof lignes === "string") { try { lignes = JSON.parse(lignes); } catch (e) { lignes = []; } }
      return '<div class="cmd"><b>TME-' + String(c.id).padStart(4, "0") + '</b> <span class="statut">' + esc(c.statut) + '</span><br>' +
        '<small>' + esc(new Date(c.created_at).toLocaleString("fr-FR")) + '</small><br>' +
        (lignes || []).map(l => esc(l.quantite) + " × " + esc(l.produit) + " (" + esc(l.conditionnement) + ")").join("<br>") +
        '<br><b>Total : ' + esc(c.total) + ' MRU</b></div>';
    }).join("");
  })
  .catch(e => { el.innerHTML = '<p style="padding:16px">Impossible de charger vos commandes. (' + esc(e.message) + ')</p>'; });
}
</script>
</body>
</html>
