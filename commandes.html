<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes commandes</title>
<style>
  body { margin:0; font-family:Arial,sans-serif; color:#222; }
  header { background:#c8102e; color:#fff; padding:16px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  a.retour { color:#fff; text-decoration:none; display:block; text-align:left; margin-bottom:8px; }
  .cmd { border:2px solid #c8102e; border-radius:10px; margin:12px; padding:12px; }
  .cmd b { color:#c8102e; }
  .statut { display:inline-block; background:#c8102e; color:#fff; border-radius:6px; padding:2px 8px; font-size:14px; }
  small { color:#666; }
</style>
</head>
<body>
<header><a class="retour" href="index.html">&larr; Accueil</a><h1>Mes commandes</h1></header>
<div id="liste"></div>
<script>
let commandes = [];
try { commandes = JSON.parse(localStorage.getItem("commandes")) || []; } catch (e) {}
const el = document.getElementById("liste");
if (commandes.length === 0) {
  el.innerHTML = '<p style="padding:16px">Aucune commande pour le moment.</p>';
} else {
  el.innerHTML = commandes.slice().reverse().map(c =>
    '<div class="cmd"><b>' + c.numero + '</b> <span class="statut">' + c.statut + '</span><br>' +
    '<small>' + c.date + '</small><br>' +
    c.lignes.map(l => l.quantite + " × " + l.produit + " (" + l.conditionnement + ")").join("<br>") +
    '<br><b>Total : ' + c.total + ' MRU</b></div>'
  ).join("");
}
</script>
</body>
</html>
