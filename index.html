<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabac Mauritanie Express</title>
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#fff; color:#222; }
  header { background:#c8102e; color:#fff; padding:20px; text-align:center; }
  header h1 { margin:0; font-size:22px; }
  main { padding:20px; }
  .btn { display:block; width:100%; padding:18px; margin:12px 0; background:#c8102e; color:#fff; border:none; border-radius:10px; font-size:18px; }
  .btn.blanc { background:#fff; color:#c8102e; border:2px solid #c8102e; }
</style>
</head>
<body>
<header><h1>TABAC MAURITANIE EXPRESS</h1></header>
<main>
  <button class="btn">Catalogue</button>
  <button class="btn blanc">Mon panier</button>
  <button class="btn blanc">Mes commandes</button>
  <button class="btn blanc">Mon compte</button>
</main>
</body>
</html>
