<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue - Tabac Mauritanie Express</title>
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#fff; color:#222; padding-bottom:110px; }
  header { background:#c8102e; color:#fff; padding:16px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  a.retour { color:#fff; text-decoration:none; display:block; text-align:left; margin-bottom:8px; }
  .produit { border:2px solid #c8102e; border-radius:10px; margin:12px; padding:12px; }
  .produit h2 { margin:0 0 8px; font-size:18px; color:#c8102e; }
  .ligne { display:flex; align-items:center; justify-content:space-between; margin:8px 0; }
  .qte button { width:44px; height:44px; font-size:22px; border:none; border-radius:8px; background:#c8102e; color:#fff; }
  .qte span { display:inline-block; min-width:36px; text-align:center; font-size:18px; }
  .panier { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:3px solid #c8102e; padding:12px; }
  .panier .total { font-size:18px; font-weight:bold; margin-bottom:8px; }
  .panier button { width:100%; padding:16px; font-size:18px; background:#c8102e; color:#fff; border:none; border-radius:10px; }
  small { color:#888; }
</style>
</head>
<body>
<header><a class="retour" href="index.html">&larr; Accueil</a><h1>Catalogue</h1></header>
<div id="liste"></div>
<div class="panier">
  <div class="total">Total : <span id="total">0</span> MRU <small id="detail"></small></div>
  <button onclick="valider()">Valider la commande</button>
</div>
<script>
// PRIX PROVISOIRES : à remplacer par les vrais prix (plus tard, depuis l'espace admin)
const PRODUITS = [
  { id:1, nom:"Marlboro Rouge",        cartouche:1000, carton:10000 },
  { id:2, nom:"Marlboro Light",        cartouche:1000, carton:10000 },
  { id:3, nom:"Congress - 1re qualité", cartouche:800,  carton:8000 },
  { id:4, nom:"Congress - 2e qualité",  cartouche:700,  carton:7000 },
  { id:5, nom:"Oris",                   cartouche:600,  carton:6000 }
];
let panier = {};
function cle(id, type) { return id + "_" + type; }
function changer(id, type, delta) {
  const k = cle(id, type);
  panier[k] = Math.max(0, (panier[k] || 0) + delta);
  afficher();
}
function afficher() {
  let total = 0, nb = 0;
  const html = PRODUITS.map(p => {
    const ligne = (type) => {
      const q = panier[cle(p.id, type)] || 0;
      total += q * p[type]; nb += q;
      return '<div class="ligne"><div>' + (type === "cartouche" ? "Cartouche" : "Carton") +
        '<br><small>' + p[type] + ' MRU</small></div><div class="qte">' +
        '<button onclick="changer(' + p.id + ',\'' + type + '\',-1)">&minus;</button>' +
        '<span>' + q + '</span>' +
        '<button onclick="changer(' + p.id + ',\'' + type + '\',1)">+</button></div></div>';
    };
    return '<div class="produit"><h2>' + p.nom + '</h2>' + ligne("cartouche") + ligne("carton") + '</div>';
  }).join("");
  document.getElementById("liste").innerHTML = html;
  document.getElementById("total").textContent = total;
  document.getElementById("detail").textContent = nb ? "(" + nb + " article(s))" : "";
  try { localStorage.setItem("panier", JSON.stringify(panier)); } catch (e) {}
}
function valider() {
  const total = Number(document.getElementById("total").textContent);
  if (total === 0) { alert("Votre panier est vide."); return; }
  const lignes = [];
  PRODUITS.forEach(p => ["cartouche", "carton"].forEach(type => {
    const q = panier[cle(p.id, type)] || 0;
    if (q > 0) lignes.push({ produit: p.nom, conditionnement: type, quantite: q, prix_unitaire: p[type] });
  }));
  let commandes = [];
  try { commandes = JSON.parse(localStorage.getItem("commandes")) || []; } catch (e) {}
  const numero = "TME-" + String(commandes.length + 1).padStart(4, "0");
  commandes.push({ numero: numero, date: new Date().toLocaleString("fr-FR"), statut: "En attente", total: total, lignes: lignes });
  try { localStorage.setItem("commandes", JSON.stringify(commandes)); } catch (e) {}
  panier = {};
  afficher();
  alert("Commande " + numero + " enregistrée (statut : En attente).");
}
try { panier = JSON.parse(localStorage.getItem("panier")) || {}; } catch (e) { panier = {}; }
afficher();
</script>
</body>
</html>
